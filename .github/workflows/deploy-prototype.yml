# Pages デプロイ可否確認用の一時ワークフロー（プロトタイプ検証後に削除予定）。
# main の公開デモを上書きするため、手動実行（workflow_dispatch）のみ。
# 検証後は main の Deploy ワークフローを再実行して元に戻すこと。
name: Deploy Prototype to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
        working-directory: prototype
      - run: npm run build
        working-directory: prototype
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./prototype/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
